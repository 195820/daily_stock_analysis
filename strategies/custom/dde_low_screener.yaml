# DDE 低位选股策略
# 策略逻辑：筛选 DDE 大单净量强势 + 低位启动的股票
#
# DDE 计算方式: 大单净流入金额 / 流通市值 × 100%
# 这个指标更接近同花顺的 DDE 概念（大单净买入占流通盘比例）
#
# 条件说明：
# 1. DDE大单净量 >= 0.6%  — 主力资金明显净流入
# 2. 最低价/昨日最低价 ∈ [1.0, 1.02)  — 低位企稳，未大幅高开
# 3. 近2日区间DDE >= 0.6%  — 连续资金流入
#
# 适用场景：盘中实时扫描，捕捉主力资金介入的低位标的

name: dde_low_screener
display_name: DDE低位精选
description: 基于DDE大单净量和最低价区间的短线选股策略
category: screener

# 策略指令（供 AI 分析时参考）
instructions: |
  这是一个量化筛选策略，用于从全市场中筛选出符合以下条件的股票：

  1. DDE大单净量 >= 0.6%：主力资金明显净流入（大单净流入金额/流通市值）
  2. 最低价比率 ∈ [1.0, 1.02)：今日最低价相对昨日小幅上涨或持平，未大幅高开
  3. 近2日区间DDE >= 0.6%：连续两日资金持续流入，非一日游行情

  综合评分 = 各条件按权重加权得分

# 量化筛选条件
screener_conditions:
  # 条件1: DDE大单净量 >= 0.6%
  - field: dde_big_order
    operator: gte
    value: 0.6
    weight: 0.3
    description: DDE大单净量 >= 0.6%

  # 条件2+3: 最低价/昨日最低价 ∈ [1.0, 1.02)
  # 使用 between 运算符同时满足 >= 1 和 < 1.02
  - field: low_ratio
    operator: between
    value: [1.0, 1.02]
    weight: 0.25
    description: 最低价比率 ∈ [1.0, 1.02)

  # 条件4: 近2日区间DDE >= 0.6%
  - field: dde_range_2d
    operator: gte
    value: 0.6
    weight: 0.45
    description: 近2日区间DDE >= 0.6%
